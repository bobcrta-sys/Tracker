<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lopatcong U10 - Game Tracker</title>
<style>
  :root {
    --navy: #002855;
    --blue: #1f5fa8;
    --yellow: #ffd400;
    --yellow-dark: #e6bf00;
    --grass: #2e8b3d;
    --grass-dark: #287a35;
    --text: #14283f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--navy), var(--blue));
    min-height: 100vh;
    padding: 10px;
    color: var(--text);
    touch-action: pan-y;
  }
  .header { text-align: center; color: var(--yellow); margin-bottom: 6px; }
  .header h1 { margin: 0; font-size: 18px; }
  .header p { margin: 2px 0 0; color: #cfe0f5; font-size: 11px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    flex: 1;
    padding: 9px 4px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    background: rgba(255,255,255,0.15);
    color: #cfe0f5;
  }
  .tabs button.active { background: var(--yellow); color: var(--navy); }

  /* Team name row */
  .team-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .team-row input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    text-align: center;
    font-weight: 700;
  }
  .score-vs { color: var(--yellow); font-weight: 800; font-size: 16px; }

  /* Scoreboard */
  .scoreboard {
    text-align: center;
    color: white;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .scoreboard .half-tag {
    display: block;
    font-size: 11px;
    color: var(--yellow);
    font-weight: 700;
    margin-top: 2px;
  }

  /* Clock bar */
  .clock-bar {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .clock-time {
    font-size: 24px;
    font-weight: 800;
    color: var(--yellow);
    font-variant-numeric: tabular-nums;
    min-width: 72px;
    text-align: center;
  }
  .clock-btns { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
  .clock-btns button {
    flex: 1;
    min-width: 56px;
    border: none;
    border-radius: 8px;
    padding: 8px 3px;
    font-weight: 700;
    font-size: 11px;
  }
  .btn-start { background: #2ecc71; color: white; }
  .btn-pause { background: var(--yellow); color: var(--navy); }
  .btn-reset { background: rgba(255,255,255,0.25); color: white; }
  .btn-half2 { background: var(--blue); color: white; }
  .mins-input {
    width: 42px;
    padding: 6px 2px;
    border-radius: 6px;
    border: none;
    text-align: center;
    font-size: 13px;
  }

  /* Goals panel */
  .panel {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--yellow); }
  .goal-form {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .goal-form select {
    flex: 1;
    min-width: 110px;
    padding: 8px 4px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
  }
  .goal-form button {
    background: var(--yellow);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-weight: 700;
    font-size: 12px;
    white-space: nowrap;
  }
  .opp-goal-btn {
    width: 100%;
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px dashed rgba(255,255,255,0.5);
    border-radius: 8px;
    padding: 8px;
    font-weight: 700;
    font-size: 12px;
  }
  .goal-list { margin-top: 8px; max-height: 130px; overflow-y: auto; }
  .goal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 4px;
    font-size: 12px;
    color: white;
  }
  .goal-row .del { background: none; border: none; color: #ff9b9b; font-size: 14px; padding: 0 4px; }

  /* Field */
  .field {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: repeating-linear-gradient(
      to bottom, var(--grass) 0, var(--grass) 10%, var(--grass-dark) 10%, var(--grass-dark) 20%
    );
    border-radius: 10px;
    border: 3px solid white;
    margin-bottom: 10px;
    overflow: hidden;
    touch-action: none;
  }
  .field .line { position: absolute; background: rgba(255,255,255,0.85); }
  .halfway { left: 0; right: 0; top: 50%; height: 2px; }
  .center-circle {
    left: 50%; top: 50%; width: 22%; padding-bottom: 22%;
    border: 2px solid rgba(255,255,255,0.85); border-radius: 50%;
    background: none; transform: translate(-50%, -50%);
  }
  .box-top { left: 22%; top: 0; width: 56%; height: 14%; border: 2px solid rgba(255,255,255,0.85); border-top: none; background: none; }
  .box-bottom { left: 22%; bottom: 0; width: 56%; height: 14%; border: 2px solid rgba(255,255,255,0.85); border-bottom: none; background: none; }

  .slot {
    position: absolute; width: 62px; height: 62px; transform: translate(-50%, -50%);
    border: 2px dashed rgba(255,255,255,0.6); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: rgba(255,255,255,0.75); font-weight: 700;
    text-align: center; line-height: 1.1; padding: 4px;
  }
  .slot[data-slot-id="gk"] { background: rgba(46, 204, 113, 0.45); border-color: rgba(255,255,255,0.9); }
  .slot.filled { border-style: solid; border-color: var(--yellow); }
  .slot[data-slot-id="gk"].filled { border-color: var(--yellow); }
  .slot.drop-hover { background: rgba(255,212,0,0.35); }

  .chip {
    position: relative; width: 60px; height: 60px; border-radius: 50%;
    background: white; border: 3px solid var(--blue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; cursor: grab; user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .chip.on-field { border-color: var(--yellow-dark); }
  .chip .initials { font-weight: 800; font-size: 15px; color: var(--navy); line-height: 1; }
  .chip .shift-clock { font-size: 8px; font-weight: 700; color: var(--blue); margin-top: 1px; }
  .drag-ghost { position: fixed; z-index: 999; pointer-events: none; opacity: 0.9; transform: translate(-50%, -50%) scale(1.08); }

  /* Bench */
  .bench-header { display: flex; align-items: center; justify-content: space-between; color: var(--yellow); font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .bench-header span.sub { color: #cfe0f5; font-weight: 400; font-size: 10px; }
  .bench { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 8px; display: flex; flex-wrap: wrap; gap: 10px; min-height: 90px; justify-content: center; }
  .bench.drop-hover { background: rgba(255,212,0,0.15); }
  .bench-chip-wrap { display: flex; flex-direction: column; align-items: center; width: 62px; }
  .bench-total { font-size: 9px; color: white; margin-top: 3px; font-weight: 700; text-align: center; }
  .bench-name { font-size: 9px; color: #dbe9fb; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .needs-time .bench-total { color: #ffb3b3; }

  .summary-toggle { text-align: center; margin: 10px 0 6px; }
  .summary-toggle button { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #cfe0f5; padding: 7px 14px; border-radius: 20px; font-size: 12px; }
  .summary { display: none; background: white; border-radius: 12px; padding: 10px; margin-top: 4px; }
  .summary.open { display: block; }
  .summary h3 { margin: 0 0 6px; font-size: 13px; color: var(--navy); }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 4px; border-bottom: 1px solid #eef2f7; font-size: 13px; }
  .summary-row .sname { font-weight: 600; color: var(--navy); }
  .summary-row .stotal { font-weight: 800; color: var(--blue); font-size: 12px; }
  .summary-row.low .stotal { color: #c0392b; }
  .summary-row.high .stotal { color: #1e7a1e; }

  /* Finalize */
  .finalize-row { margin: 14px 0 6px; }
  .finalize-btn {
    width: 100%;
    background: #c0392b;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  /* Games tab */
  .no-results { text-align: center; padding: 24px; color: #cfe0f5; font-size: 13px; }
  .game-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .game-card summary {
    padding: 12px;
    font-weight: 700;
    font-size: 13px;
    color: var(--navy);
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .game-card summary::-webkit-details-marker { display: none; }
  .spread-badge {
    background: var(--blue);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .game-detail { padding: 0 12px 12px; }
  .game-detail h4 { margin: 8px 0 4px; font-size: 12px; color: var(--navy); }
  .game-detail .goal-row { background: #f3f6fa; color: var(--navy); }
</style>
</head>
<body>

<div class="header">
  <h1>⚽ Lopatcong U10 Game Tracker</h1>
  <p>Drag players on/off the field · log goals · finalize for a full report</p>
</div>

<div class="tabs">
  <button id="tabLiveBtn" class="active" onclick="switchTab('live')">Live Game</button>
  <button id="tabGamesBtn" onclick="switchTab('games')">Game History</button>
</div>

<div id="liveView">

  <div class="team-row">
    <input id="teamNameInput" value="Lopatcong" />
    <span class="score-vs">vs</span>
    <input id="opponentInput" value="Opponent" />
  </div>

  <div class="scoreboard" id="scoreboard">0 - 0
    <span class="half-tag" id="halfTag">Half 1</span>
  </div>

  <div class="clock-bar">
    <div class="clock-time" id="clockDisplay">25:00</div>
    <div class="clock-btns">
      <input class="mins-input" id="minsInput" type="number" value="25" min="1" max="60" title="Minutes per half" />
      <button class="btn-start" onclick="startClock()">Start</button>
      <button class="btn-pause" onclick="pauseClock()">Pause</button>
      <button class="btn-reset" onclick="resetClock()">Reset</button>
      <button class="btn-half2" id="half2Btn" onclick="switchToHalf2()">Half 2 &rarr;</button>
    </div>
  </div>

  <div class="panel">
    <h3>Log a Goal</h3>
    <div class="goal-form">
      <select id="scorerSelect"></select>
      <select id="assistSelect"></select>
      <button onclick="logOurGoal()">+ Goal</button>
    </div>
    <button class="opp-goal-btn" onclick="logOppGoal()">+1 Opponent Goal</button>
    <div class="goal-list" id="goalList"></div>
  </div>

  <div class="field" id="field">
    <div class="line halfway"></div>
    <div class="line center-circle"></div>
    <div class="line box-top"></div>
    <div class="line box-bottom"></div>
  </div>

  <div class="bench-header">
    <span>Bench <span class="sub">(sorted: least playtime first)</span></span>
  </div>
  <div class="bench" id="bench"></div>

  <div class="summary-toggle">
    <button onclick="toggleSummary()">📊 Show Playing Time Summary</button>
  </div>
  <div class="summary" id="summary">
    <h3>Total Playing Time (this game)</h3>
    <div id="summaryList"></div>
  </div>

  <div class="finalize-row">
    <button class="finalize-btn" onclick="finalizeGame()">🏁 Finalize Game</button>
  </div>
</div>

<div id="gamesView" style="display:none;">
  <div id="syncStatus" style="text-align:center;color:#cfe0f5;font-size:11px;margin-bottom:8px;"></div>
  <button class="opp-goal-btn" style="margin-bottom:10px;" onclick="exportGamesCsv()">⬇️ Export All Games (CSV)</button>
  <div id="gamesList"></div>
</div>

<script>

const firebaseConfig = {

  messagingSenderId: "411061837181",

  // ============================================================

<script>
/* ---------- Roster & slots ---------- */
const slots = [
  { id: 'gk', label: 'Goalie', x: 50, y: 90 },
  { id: 'ldef', label: 'L Def', x: 25, y: 70 },
  { id: 'rdef', label: 'R Def', x: 75, y: 70 },
  { id: 'lm', label: 'LM', x: 15, y: 42 },
  { id: 'cm', label: 'CM', x: 50, y: 45 },
  { id: 'rm', label: 'RM', x: 85, y: 42 },
  { id: 'st', label: 'Striker', x: 50, y: 30 }
];

function mkPlayer(name) {
  return { id: Math.random().toString(36).slice(2), name, slotId: null, sessionStart: null, half1Sec: 0, half2Sec: 0 };
}

let players = [
  mkPlayer("Bella"), mkPlayer("Mila"), mkPlayer("Ishmon"),
  mkPlayer("Logan"), mkPlayer("Elliot F"), mkPlayer("Jo"),
  mkPlayer("Jordon"), mkPlayer("Austin"), mkPlayer("Parker"),
  mkPlayer("Riann"), mkPlayer("Riley"), mkPlayer("Elliott"),
  mkPlayer("Everly"), mkPlayer("Charlie"), mkPlayer("Rayon"),
  mkPlayer("Jaxson")
];

function initials(name) {
  const parts = name.trim().split(' ');
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return parts.map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

/* ---------- Game / half state ---------- */
let half = 1;
let gameRunning = false;
let gameRemainingSec = 25 * 60;
let halfEndAt = null; // epoch ms timestamp the current half will hit 0, if uninterrupted
let gameIntervalId = null;
let wakeLock = null;
let goals = []; // { id, team:'us'|'opp', half, clockLabel, scorerName, assistName }
let savedGames = [];
let currentTab = 'live';

window.__onGamesUpdate = function (games) {
  savedGames = games;
  if (currentTab === 'games') renderGamesList();
};

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* Wake lock not permitted in this context — clock still stays accurate via timestamps */ }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (gameRunning) requestWakeLock();
    render(); // recompute remaining time immediately from halfEndAt
  }
});

function getHalfLengthSec() { return (parseFloat(document.getElementById('minsInput').value) || 25) * 60; }
function bucketKey() { return half === 1 ? 'half1Sec' : 'half2Sec'; }

function startClock() {
  if (gameRunning) return;
  gameRunning = true;
  halfEndAt = Date.now() + gameRemainingSec * 1000;
  const now = Date.now();
  players.forEach(p => { if (p.slotId && !p.sessionStart) p.sessionStart = now; });
  gameIntervalId = setInterval(tick, 1000);
  document.getElementById('minsInput').disabled = true;
  requestWakeLock();
  render();
}

function pauseClock() {
  if (gameRunning) {
    gameRemainingSec = Math.max(0, Math.round((halfEndAt - Date.now()) / 1000));
    halfEndAt = null;
  }
  gameRunning = false;
  clearInterval(gameIntervalId);
  flushAllSessions();
  releaseWakeLock();
  render();
}

function resetClock() {
  gameRunning = false;
  clearInterval(gameIntervalId);
  halfEndAt = null;
  flushAllSessions();
  gameRemainingSec = getHalfLengthSec();
  document.getElementById('minsInput').disabled = false;
  releaseWakeLock();
  render();
}

function switchToHalf2() {
  if (half !== 1) return;
  gameRunning = false;
  clearInterval(gameIntervalId);
  halfEndAt = null;
  flushAllSessions();
  half = 2;
  gameRemainingSec = getHalfLengthSec();
  releaseWakeLock();
  render();
}

function tick() {
  if (!halfEndAt) return;
  gameRemainingSec = Math.max(0, Math.round((halfEndAt - Date.now()) / 1000));
  if (gameRemainingSec <= 0) pauseClock();
  render();
}

function flushSession(p) {
  if (p.sessionStart) {
    p[bucketKey()] += Math.floor((Date.now() - p.sessionStart) / 1000);
    p.sessionStart = null;
  }
}
function flushAllSessions() { players.forEach(flushSession); }

function fmtClock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function fmtMin(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
function liveTotal(p) { let sec = p.half1Sec + p.half2Sec; if (p.sessionStart) sec += Math.floor((Date.now() - p.sessionStart) / 1000); return sec; }

/* ---------- Field placement ---------- */
function playerInSlot(slotId) { return players.find(p => p.slotId === slotId); }

function putOnField(player, slotId) {
  const occupant = playerInSlot(slotId);
  if (occupant && occupant.id !== player.id) {
    const playerOldSlot = player.slotId;
    moveOff(occupant);
    if (playerOldSlot) occupant.slotId = playerOldSlot;
  }
  const wasOnField = !!player.slotId;
  player.slotId = slotId;
  if (!wasOnField && gameRunning && !player.sessionStart) player.sessionStart = Date.now();
}

function moveOff(player) { flushSession(player); player.slotId = null; }

/* ---------- Goals ---------- */
function populateGoalSelects() {
  const scorerSel = document.getElementById('scorerSelect');
  const assistSel = document.getElementById('assistSelect');
  const sorted = players.slice().sort((a, b) => a.name.localeCompare(b.name));
  scorerSel.innerHTML = sorted.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  assistSel.innerHTML = `<option value="">No assist</option>` + sorted.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

function logOurGoal() {
  const scorer = players.find(p => p.id === document.getElementById('scorerSelect').value);
  const assist = players.find(p => p.id === document.getElementById('assistSelect').value);
  goals.push({ id: Date.now().toString(36), team: 'us', half, clockLabel: fmtClock(gameRemainingSec), scorerName: scorer ? scorer.name : 'Unknown', assistName: assist ? assist.name : null });
  render();
}
function logOppGoal() {
  goals.push({ id: Date.now().toString(36), team: 'opp', half, clockLabel: fmtClock(gameRemainingSec), scorerName: 'Opponent', assistName: null });
  render();
}
function removeGoal(id) { goals = goals.filter(g => g.id !== id); render(); }

/* ---------- Rendering (live view) ---------- */
function render() {
  document.getElementById('clockDisplay').textContent = fmtClock(gameRemainingSec);
  document.getElementById('halfTag').textContent = 'Half ' + half;
  document.getElementById('half2Btn').disabled = half !== 1;
  document.getElementById('half2Btn').style.opacity = half !== 1 ? 0.4 : 1;

  const ourGoals = goals.filter(g => g.team === 'us').length;
  const oppGoals = goals.filter(g => g.team === 'opp').length;
  document.getElementById('scoreboard').childNodes[0].textContent = ourGoals + ' - ' + oppGoals + ' ';

  // goal list
  const goalList = document.getElementById('goalList');
  goalList.innerHTML = goals.length ? goals.map(g => `
    <div class="goal-row">
      <span>${g.team === 'us' ? '⚽' : '❌'} ${g.scorerName}${g.assistName ? ' (assist: ' + g.assistName + ')' : ''} — H${g.half}, ${g.clockLabel} left</span>
      <button class="del" onclick="removeGoal('${g.id}')">&times;</button>
    </div>`).join('') : '<div class="goal-row" style="justify-content:center;">No goals yet</div>';

  // field slots
  document.querySelectorAll('.slot').forEach(el => el.remove());
  const field = document.getElementById('field');
  slots.forEach(slot => {
    const slotEl = document.createElement('div');
    slotEl.className = 'slot';
    slotEl.dataset.slotId = slot.id;
    slotEl.style.left = slot.x + '%';
    slotEl.style.top = slot.y + '%';
    const occ = playerInSlot(slot.id);
    if (occ) { slotEl.classList.add('filled'); slotEl.appendChild(buildChip(occ, true)); }
    else slotEl.textContent = slot.label;
    field.appendChild(slotEl);
  });

  // bench
  const bench = document.getElementById('bench');
  bench.innerHTML = '';
  const benchPlayers = players.filter(p => !p.slotId).sort((a, b) => liveTotal(a) - liveTotal(b));
  const totals = players.map(liveTotal);
  const minTotal = Math.min(...totals);
  benchPlayers.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'bench-chip-wrap' + (liveTotal(p) === minTotal ? ' needs-time' : '');
    wrap.appendChild(buildChip(p, false));
    const nameEl = document.createElement('div');
    nameEl.className = 'bench-name';
    nameEl.textContent = p.name.split(' ')[0];
    const totalEl = document.createElement('div');
    totalEl.className = 'bench-total';
    totalEl.textContent = fmtMin(liveTotal(p));
    wrap.appendChild(nameEl);
    wrap.appendChild(totalEl);
    bench.appendChild(wrap);
  });

  renderSummary();
  populateGoalSelects();
}

function buildChip(player, onField) {
  const chip = document.createElement('div');
  chip.className = 'chip' + (onField ? ' on-field' : '');
  chip.dataset.playerId = player.id;
  chip.innerHTML = `<div class="initials">${initials(player.name)}</div>` + (onField ? `<div class="shift-clock">${fmtMin(liveTotal(player))}</div>` : '');
  attachDrag(chip, player);
  return chip;
}

function renderSummary() {
  const list = document.getElementById('summaryList');
  list.innerHTML = '';
  const sorted = players.slice().sort((a, b) => liveTotal(b) - liveTotal(a));
  const totals = sorted.map(liveTotal);
  const maxT = Math.max(...totals), minT = Math.min(...totals);
  sorted.forEach(p => {
    const t = liveTotal(p);
    const row = document.createElement('div');
    row.className = 'summary-row' + (t === maxT ? ' high' : '') + (t === minT ? ' low' : '');
    row.innerHTML = `<span class="sname">${p.name}${p.slotId ? ' 🟢' : ''}</span><span class="stotal">${fmtMin(t)}</span>`;
    list.appendChild(row);
  });
}

function toggleSummary() { document.getElementById('summary').classList.toggle('open'); }

/* ---------- Drag & drop ---------- */
let dragState = null;
function attachDrag(chipEl, player) {
  chipEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const rect = chipEl.getBoundingClientRect();
    const ghost = chipEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.left = (rect.left + rect.width / 2) + 'px';
    ghost.style.top = (rect.top + rect.height / 2) + 'px';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    document.body.appendChild(ghost);
    chipEl.style.visibility = 'hidden';
    dragState = { player, ghost };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp, { once: true });
  });
}
function onMove(e) {
  if (!dragState) return;
  dragState.ghost.style.left = e.clientX + 'px';
  dragState.ghost.style.top = e.clientY + 'px';
  document.querySelectorAll('.slot, .bench').forEach(el => el.classList.remove('drop-hover'));
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const slotEl = under && under.closest('.slot');
  const benchEl = under && under.closest('.bench');
  if (slotEl) slotEl.classList.add('drop-hover'); else if (benchEl) benchEl.classList.add('drop-hover');
}
function onUp(e) {
  document.removeEventListener('pointermove', onMove);
  document.querySelectorAll('.slot, .bench').forEach(el => el.classList.remove('drop-hover'));
  if (dragState) {
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slotEl = under && under.closest('.slot');
    const benchEl = under && under.closest('.bench');
    const player = dragState.player;
    if (slotEl) putOnField(player, slotEl.dataset.slotId);
    else if (benchEl) moveOff(player);
    dragState.ghost.remove();
    dragState = null;
  }
  render();
}

setInterval(() => {
  if (gameRunning && currentTab === 'live') {
    document.querySelectorAll('.chip.on-field .shift-clock').forEach(el => {
      const chipEl = el.closest('.chip');
      const p = players.find(pl => pl.id === chipEl.dataset.playerId);
      if (p) el.textContent = fmtMin(liveTotal(p));
    });
  }
}, 1000);

/* ---------- Tabs ---------- */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('liveView').style.display = tab === 'live' ? 'block' : 'none';
  document.getElementById('gamesView').style.display = tab === 'games' ? 'block' : 'none';
  document.getElementById('tabLiveBtn').classList.toggle('active', tab === 'live');
  document.getElementById('tabGamesBtn').classList.toggle('active', tab === 'games');
  if (tab === 'games') {
    document.getElementById('syncStatus').textContent = window.__firebaseReady
      ? '🟢 Synced live across devices'
      : '⚪ Saved on this device only (Firebase not configured yet)';
    renderGamesList();
  }
}

/* ---------- Finalize & history ---------- */
function buildReport() {
  const ourGoals = goals.filter(g => g.team === 'us').length;
  const oppGoals = goals.filter(g => g.team === 'opp').length;
  const playerRows = players.map(p => ({
    name: p.name,
    half1Min: +(p.half1Sec / 60).toFixed(1),
    half2Min: +(p.half2Sec / 60).toFixed(1),
    totalMin: +((p.half1Sec + p.half2Sec) / 60).toFixed(1)
  })).sort((a, b) => b.totalMin - a.totalMin);
  const totals = playerRows.map(r => r.totalMin);
  return {
    id: Date.now().toString(36),
    date: new Date().toLocaleString(),
    dateISO: new Date().toISOString(),
    teamName: document.getElementById('teamNameInput').value || 'Lopatcong',
    opponentName: document.getElementById('opponentInput').value || 'Opponent',
    ourGoals, oppGoals,
    halfLengthMin: parseFloat(document.getElementById('minsInput').value) || 25,
    goals: goals.map(g => ({ ...g })),
    players: playerRows,
    minMin: Math.min(...totals),
    maxMin: Math.max(...totals),
    spreadMin: +(Math.max(...totals) - Math.min(...totals)).toFixed(1)
  };
}

function saveGamesToStorage() {
  try {
    localStorage.setItem('lopatcong-games', JSON.stringify(savedGames));
  } catch (e) { console.error('Could not save game history', e); }
}
function loadGamesFromStorage() {
  try {
    const raw = localStorage.getItem('lopatcong-games');
    if (raw) savedGames = JSON.parse(raw);
  } catch (e) { savedGames = []; }
}

function resetForNewGame() {
  half = 1;
  gameRunning = false;
  clearInterval(gameIntervalId);
  gameRemainingSec = getHalfLengthSec();
  goals = [];
  players.forEach(p => { p.slotId = null; p.sessionStart = null; p.half1Sec = 0; p.half2Sec = 0; });
  document.getElementById('minsInput').disabled = false;
}

async function finalizeGame() {
  if (!confirm('Finalize this game? This saves the report to Game History and clears the board for a new game.')) return;
  gameRunning = false;
  clearInterval(gameIntervalId);
  halfEndAt = null;
  flushAllSessions();
  releaseWakeLock();
  const report = buildReport();

  let savedToCloud = false;
  if (window.__firebaseSaveGame) {
    try {
      await window.__firebaseSaveGame(report);
      savedToCloud = true; // real-time listener will add it to savedGames automatically
    } catch (e) {
      console.warn('Could not save to Firebase, saving locally instead.', e);
    }
  }
  if (!savedToCloud) {
    savedGames.unshift(report);
    saveGamesToStorage();
  }

  resetForNewGame();
  render();
  switchTab('games');
}

function gameCardHtml(g) {
  const goalsHtml = g.goals.length
    ? g.goals.map(gl => `<div class="goal-row">${gl.team === 'us' ? '⚽' : '❌'} ${gl.scorerName}${gl.assistName ? ' (assist: ' + gl.assistName + ')' : ''} — H${gl.half}, ${gl.clockLabel} left</div>`).join('')
    : '<div class="goal-row">No goals logged.</div>';
  const playersHtml = g.players.map(p => `
    <div class="summary-row${p.totalMin === g.minMin ? ' low' : ''}${p.totalMin === g.maxMin ? ' high' : ''}">
      <span class="sname">${p.name}</span>
      <span class="stotal">${p.totalMin}m (H1 ${p.half1Min}, H2 ${p.half2Min})</span>
    </div>`).join('');
  return `
  <details class="game-card">
    <summary>${g.date} — ${g.teamName} ${g.ourGoals}-${g.oppGoals} ${g.opponentName} <span class="spread-badge">spread ${g.spreadMin}m</span></summary>
    <div class="game-detail">
      <h4>Goals</h4>
      ${goalsHtml}
      <h4>Playing Time (${g.halfLengthMin} min halves)</h4>
      ${playersHtml}
    </div>
  </details>`;
}

function exportGamesCsv() {
  if (savedGames.length === 0) { alert('No finalized games to export yet.'); return; }
  const rows = [['Date', 'Team', 'Opponent', 'Our Goals', 'Opp Goals', 'Half Length (min)', 'Player', 'Half 1 Min', 'Half 2 Min', 'Total Min']];
  savedGames.forEach(g => {
    g.players.forEach(p => {
      rows.push([g.date, g.teamName, g.opponentName, g.ourGoals, g.oppGoals, g.halfLengthMin, p.name, p.half1Min, p.half2Min, p.totalMin]);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lopatcong-u10-game-history.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderGamesList() {
  const container = document.getElementById('gamesList');
  if (savedGames.length === 0) {
    container.innerHTML = '<div class="no-results">No games finalized yet. Play a game and hit "Finalize Game" to see the report here.</div>';
    return;
  }
  container.innerHTML = savedGames.map(gameCardHtml).join('');
}

/* ---------- Init ---------- */
(async function init() {
  await loadGamesFromStorage();
  render();
})();
</script>
